name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: GNU conformance
        env:
          GOBASH_GNU: "1"
          GOBASH_GNU_PREFIX: ""
        run: go test -run TestAgainstGNU -v ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.0
        with:
          version: v2.12.2
